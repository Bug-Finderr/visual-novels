<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cardGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#14110b"/>
    </linearGradient>
    <marker id="arrowRT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a857"/>
    </marker>
    <marker id="arrowRTr" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#91a87a"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#07060a"/>
  <ellipse cx="640" cy="-100" rx="900" ry="350" fill="#1c1207" opacity="0.55"/>

  <text x="60" y="62" font-family="Cormorant Garamond, serif" font-size="34" fill="#f3e7cf">Runtime — per page click</text>
  <line x1="62" y1="80" x2="280" y2="80" stroke="#d4a857" stroke-width="1.3"/>
  <text x="60" y="105" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" fill="#ebc473">A DB lookup, not an LLM call. Returns in &lt;100 ms.</text>

  <!-- Browser column -->
  <g>
    <rect x="60" y="160" width="280" height="500" rx="16" fill="url(#cardGrad4)" stroke="#d4a857" stroke-width="1.2"/>
    <text x="200" y="200" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="22" font-style="italic" fill="#ebc473">Browser</text>
    <line x1="100" y1="214" x2="300" y2="214" stroke="#d4a857" stroke-opacity="0.35"/>

    <text x="80" y="265" font-size="13" fill="#f3e7cf">Player clicks a Choice</text>
    <text x="80" y="285" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">{ text, alignmentTag, magnitude }</text>

    <text x="80" y="450" font-size="13" fill="#f3e7cf">Receives:</text>
    <text x="80" y="472" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">{ newLabel,</text>
    <text x="80" y="490" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">  statements,</text>
    <text x="80" y="508" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">  choices,</text>
    <text x="80" y="526" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">  alignmentState,</text>
    <text x="80" y="544" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">  beatIndex }</text>

    <text x="80" y="595" font-size="13" fill="#f3e7cf">Plays statements via</text>
    <text x="80" y="615" font-size="13" fill="#f3e7cf">typewriter + audio WS</text>
  </g>

  <!-- arrow client → server -->
  <line x1="340" y1="290" x2="540" y2="290" stroke="#d4a857" stroke-width="1.7" marker-end="url(#arrowRT)"/>
  <text x="440" y="280" text-anchor="middle" font-size="12" font-family="JetBrains Mono, monospace" fill="#ebc473">POST /api/.../choice</text>

  <!-- Server box -->
  <g>
    <rect x="540" y="160" width="380" height="500" rx="16" fill="url(#cardGrad4)" stroke="#d4a857" stroke-width="1.4"/>
    <text x="730" y="200" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="22" font-style="italic" fill="#ebc473">process_player_action</text>
    <line x1="580" y1="214" x2="880" y2="214" stroke="#d4a857" stroke-opacity="0.35"/>

    <!-- steps -->
    <g transform="translate(560,240)">
      <circle cx="0" cy="0" r="12" fill="#d4a857"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">1</text>
      <text x="22" y="5" font-size="12" fill="#f3e7cf">apply alignment to alignment_state[ending_id]</text>
    </g>
    <g transform="translate(560,280)">
      <circle cx="0" cy="0" r="12" fill="#d4a857"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">2</text>
      <text x="22" y="5" font-size="12" fill="#f3e7cf">target_beat = beat_index + 1</text>
    </g>
    <g transform="translate(560,320)">
      <circle cx="0" cy="0" r="12" fill="#d4a857"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">3</text>
      <text x="22" y="5" font-size="12" fill="#f3e7cf" font-weight="600">LOOKUP beat_expansions[sid, target]</text>
    </g>
    <g transform="translate(560,360)">
      <circle cx="0" cy="0" r="12" fill="#d4a857"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">4</text>
      <text x="22" y="5" font-size="12" fill="#f3e7cf">_ensure_scene_change(canonical sceneId)</text>
    </g>
    <g transform="translate(560,400)">
      <circle cx="0" cy="0" r="12" fill="#d4a857"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">5</text>
      <text x="22" y="5" font-size="12" fill="#f3e7cf">_ensure_cast(hide non-cast chars)</text>
    </g>
    <g transform="translate(560,440)">
      <circle cx="0" cy="0" r="12" fill="#d4a857"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">6</text>
      <text x="22" y="5" font-size="12" fill="#f3e7cf">append beat's pre-baked choices</text>
    </g>
    <g transform="translate(560,490)">
      <circle cx="0" cy="0" r="12" fill="#91a87a"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">7</text>
      <text x="22" y="5" font-size="13" fill="#91a87a" font-weight="600">200 OK in &lt;100 ms</text>
    </g>

    <!-- timing -->
    <rect x="560" y="540" width="340" height="90" rx="10" fill="#18140e" stroke="#c4663a" stroke-width="0.7"/>
    <text x="580" y="566" font-size="12" font-style="italic" fill="#ebc473">cache miss fallback:</text>
    <text x="580" y="586" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">one full-beat Flash 2.5 call → save → return</text>
    <text x="580" y="608" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">subsequent replays are cache hits.</text>
  </g>

  <!-- arrow server → DB -->
  <line x1="920" y1="320" x2="1050" y2="280" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrowRT)"/>
  <line x1="1050" y1="320" x2="920" y2="360" stroke="#91a87a" stroke-width="1.5" marker-end="url(#arrowRTr)"/>

  <!-- DB -->
  <g>
    <rect x="1050" y="240" width="180" height="150" rx="14" fill="url(#cardGrad4)" stroke="#91a87a" stroke-width="1.2"/>
    <text x="1140" y="275" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" fill="#91a87a">SQLite</text>
    <text x="1070" y="305" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">beat_expansions</text>
    <text x="1070" y="325" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">ending_dialogue</text>
    <text x="1070" y="345" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">sessions</text>
    <text x="1070" y="365" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">dialogue_history</text>
  </g>

  <!-- arrow server → response (back to browser) -->
  <line x1="540" y1="540" x2="340" y2="490" stroke="#91a87a" stroke-width="1.7" marker-end="url(#arrowRTr)"/>
  <text x="440" y="525" text-anchor="middle" font-size="12" font-family="JetBrains Mono, monospace" fill="#91a87a">200 OK + statements</text>

  <text x="60" y="700" font-size="12" font-style="italic" fill="#8c7a5b">Free-input is the only path that still calls Gemini at runtime.</text>
</svg>
