<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 940" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#14110b"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241011"/>
      <stop offset="100%" stop-color="#170b0c"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1722"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="keepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101a14"/>
      <stop offset="100%" stop-color="#0b110d"/>
    </linearGradient>
    <linearGradient id="stateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a1c"/>
      <stop offset="100%" stop-color="#0a1213"/>
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#d4a857"/>
    </marker>
    <marker id="arrowG" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#6fcf97"/>
    </marker>
    <marker id="arrowR" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#e06c5a"/>
    </marker>
    <marker id="arrowB" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#6ab0de"/>
    </marker>
  </defs>

  <rect width="1480" height="940" fill="#07060a"/>
  <ellipse cx="740" cy="-120" rx="1050" ry="380" fill="#1c1207" opacity="0.5"/>

  <!-- title -->
  <text x="60" y="60" font-family="Cormorant Garamond, serif" font-size="34" fill="#f3e7cf">Multi-agent story generation</text>
  <line x1="62" y1="78" x2="280" y2="78" stroke="#d4a857" stroke-width="1.3"/>
  <text x="60" y="102" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" fill="#ebc473">LangGraph — agents · memory gate · shared state · runtime rewrite</text>

  <!-- legend -->
  <g font-size="12" fill="#c4b08a">
    <rect x="700" y="40" width="14" height="14" rx="3" fill="url(#agentGrad)" stroke="#d4a857"/>
    <text x="720" y="52">Agent (LLM node)</text>
    <rect x="860" y="40" width="14" height="14" rx="3" fill="url(#memGrad)" stroke="#e06c5a"/>
    <text x="880" y="52">Memory gate</text>
    <rect x="985" y="40" width="14" height="14" rx="3" fill="url(#humanGrad)" stroke="#6ab0de"/>
    <text x="1005" y="52">Human / player</text>
    <rect x="1120" y="40" width="14" height="14" rx="3" fill="url(#keepGrad)" stroke="#6fcf97"/>
    <text x="1140" y="52">Kept from v2</text>
    <rect x="1255" y="40" width="14" height="14" rx="3" fill="url(#stateGrad)" stroke="#4fb3bf"/>
    <text x="1275" y="52">Shared state</text>
  </g>

  <!-- ============ PHASE 1 : BUILD-TIME GENERATION GRAPH ============ -->
  <text x="60" y="158" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" fill="#ebc473">① Build-time generation graph</text>

  <!-- START -->
  <rect x="70" y="180" width="96" height="34" rx="17" fill="#1c160e" stroke="#d4a857" stroke-width="1.2"/>
  <text x="118" y="202" font-size="13" text-anchor="middle" fill="#f3e7cf">setup</text>
  <line x1="118" y1="214" x2="118" y2="236" stroke="#d4a857" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Overall Plot Agent -->
  <rect x="70" y="240" width="252" height="128" rx="14" fill="url(#agentGrad)" stroke="#d4a857" stroke-width="1.5"/>
  <text x="196" y="268" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#ebc473">Overall Plot Agent</text>
  <line x1="96" y1="280" x2="296" y2="280" stroke="#d4a857" stroke-opacity="0.3"/>
  <text x="88" y="304" font-size="12.5" fill="#f3e7cf">• overall plot + arc</text>
  <text x="88" y="326" font-size="12.5" fill="#f3e7cf">• chapter map</text>
  <text x="88" y="348" font-size="12.5" fill="#ebc473">• character roster + 5–6 plot endings</text>

  <!-- World-building Agent -->
  <rect x="372" y="200" width="246" height="92" rx="14" fill="url(#agentGrad)" stroke="#d4a857" stroke-width="1.5"/>
  <text x="495" y="227" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#ebc473">World-building Agent</text>
  <line x1="398" y1="238" x2="592" y2="238" stroke="#d4a857" stroke-opacity="0.3"/>
  <text x="390" y="262" font-size="12.5" fill="#f3e7cf">• world lore + rules</text>
  <text x="390" y="282" font-size="12.5" fill="#f3e7cf">• scenes / locations</text>

  <!-- Character Agent (fan-out, ×N) -->
  <rect x="384" y="328" width="246" height="116" rx="14" fill="#100c07" stroke="#7a5e2c" stroke-width="1.2"/>
  <rect x="378" y="322" width="246" height="116" rx="14" fill="#15100a" stroke="#9c7836" stroke-width="1.2"/>
  <rect x="372" y="316" width="246" height="116" rx="14" fill="url(#agentGrad)" stroke="#d4a857" stroke-width="1.5"/>
  <text x="495" y="343" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#ebc473">Character Agent ×N</text>
  <line x1="398" y1="354" x2="592" y2="354" stroke="#d4a857" stroke-opacity="0.3"/>
  <text x="390" y="378" font-size="12.5" fill="#f3e7cf">• refine persona + traits</text>
  <text x="390" y="398" font-size="12.5" fill="#f3e7cf">• sprite sheet (Flash Image)</text>
  <text x="390" y="418" font-size="12.5" fill="#f3e7cf">• lore + voice caption</text>

  <!-- arrows plot -> world / character (fan-out) -->
  <line x1="322" y1="278" x2="368" y2="246" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="322" y1="320" x2="368" y2="372" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Chapter Generator Agent -->
  <rect x="690" y="232" width="280" height="212" rx="14" fill="url(#agentGrad)" stroke="#d4a857" stroke-width="1.7"/>
  <text x="830" y="260" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#ebc473">Chapter Generator Agent</text>
  <line x1="716" y1="272" x2="944" y2="272" stroke="#d4a857" stroke-opacity="0.3"/>
  <text x="708" y="298" font-size="12.5" fill="#f3e7cf">• scenes + beats for chapter</text>
  <text x="708" y="322" font-size="12.5" fill="#f3e7cf">• needed character sprites</text>
  <text x="708" y="346" font-size="12.5" fill="#f3e7cf">• voice audio (TTS)</text>
  <text x="708" y="370" font-size="12.5" fill="#ebc473">• 5 chapter endings (→ a plot ending)</text>
  <text x="708" y="400" font-size="12.5" fill="#ebc473">• user feedback → next chapter</text>
  <text x="708" y="424" font-size="11.5" font-style="italic" fill="#9c8a6a">(re-entrant per chapter)</text>

  <!-- arrows world/char -> chapter gen -->
  <line x1="618" y1="246" x2="686" y2="290" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="618" y1="374" x2="686" y2="350" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Existing pre-render pipeline (kept) -->
  <rect x="1010" y="232" width="252" height="212" rx="14" fill="url(#keepGrad)" stroke="#6fcf97" stroke-width="1.4"/>
  <text x="1136" y="258" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" text-anchor="middle" fill="#8fe0ad">Current pre-render</text>
  <text x="1136" y="277" font-size="11.5" font-style="italic" text-anchor="middle" fill="#6f9c80">v2 pipeline — kept as-is</text>
  <line x1="1036" y1="288" x2="1236" y2="288" stroke="#6fcf97" stroke-opacity="0.25"/>
  <text x="1028" y="312" font-size="12.5" fill="#f3e7cf">• beat-expansion cache</text>
  <text x="1040" y="332" font-size="11.5" font-family="JetBrains Mono, monospace" fill="#9bc4ab">3 variants / choice tag</text>
  <text x="1028" y="356" font-size="12.5" fill="#f3e7cf">• sprite gen — Flash Image</text>
  <text x="1028" y="380" font-size="12.5" fill="#f3e7cf">• Silk / Mulberry TTS → WAV</text>
  <text x="1028" y="404" font-size="12.5" fill="#f3e7cf">• pre-render chapter endings</text>

  <!-- arrow chapter gen -> pipeline -->
  <line x1="970" y1="338" x2="1006" y2="338" stroke="#6fcf97" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="930" y="330" font-size="11" fill="#8fe0ad">emit + pre-render</text>

  <!-- ============ MEMORY AGENT GATE ============ -->
  <rect x="520" y="500" width="316" height="120" rx="14" fill="url(#memGrad)" stroke="#e06c5a" stroke-width="1.7"/>
  <text x="678" y="528" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#f0a596">Memory Agent — gate</text>
  <line x1="546" y1="540" x2="810" y2="540" stroke="#e06c5a" stroke-opacity="0.3"/>
  <text x="538" y="564" font-size="12.5" fill="#f3e7cf">approves / rejects every add + update</text>
  <text x="538" y="586" font-size="12.5" fill="#f3e7cf">validates story context + continuity</text>
  <text x="538" y="608" font-size="12.5" fill="#f3e7cf">keeps canon &amp; endings consistent</text>

  <!-- dashed "propose change" arrows from each agent into the gate -->
  <g stroke="#b87d4a" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <path d="M196,368 C220,440 480,460 560,498" marker-end="url(#arrow)"/>
    <path d="M495,292 C520,420 600,460 620,498" marker-end="url(#arrow)"/>
    <path d="M560,432 C580,460 600,475 630,498" marker-end="url(#arrow)"/>
    <path d="M830,444 C800,480 760,488 720,498" marker-end="url(#arrow)"/>
  </g>
  <text x="360" y="476" font-size="11.5" font-style="italic" fill="#b87d4a">every agent: propose add / update ⤍</text>

  <!-- approved -> state -->
  <path d="M836,548 C980,548 1120,500 1196,462" fill="none" stroke="#6fcf97" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="980" y="528" font-size="11.5" fill="#8fe0ad">approved → write state</text>

  <!-- reject loop -->
  <path d="M540,560 C470,560 470,512 512,508" fill="none" stroke="#e06c5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text x="430" y="556" font-size="11.5" fill="#e06c5a">reject ↺ revise</text>

  <!-- ============ SHARED STATE PANEL ============ -->
  <rect x="1196" y="150" width="222" height="470" rx="14" fill="url(#stateGrad)" stroke="#4fb3bf" stroke-width="1.6"/>
  <text x="1307" y="178" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#7fd6df">StoryState</text>
  <line x1="1222" y1="190" x2="1392" y2="190" stroke="#4fb3bf" stroke-opacity="0.3"/>
  <g font-size="12" font-family="JetBrains Mono, monospace" fill="#bfe3e7">
    <text x="1216" y="211">story_meta</text>
    <text x="1216" y="231">plot_arc</text>
    <text x="1216" y="251">plot_endings[5-6]</text>
    <text x="1216" y="271">chapter_map[]</text>
    <text x="1216" y="291">characters[]</text>
    <text x="1216" y="311">world_lore</text>
    <text x="1216" y="331">scenes[]</text>
    <text x="1216" y="351">story_spine[10]</text>
    <text x="1216" y="371">chapter_endings[5]</text>
    <text x="1216" y="391">beat_variants{}</text>
    <text x="1216" y="411">assets{sprite,bg}</text>
    <text x="1216" y="431">audio{wav}</text>
    <text x="1216" y="451">memory_log</text>
    <text x="1216" y="471">user_feedback</text>
    <text x="1216" y="491">user_choices[]</text>
    <text x="1216" y="511">revision_count</text>
    <text x="1216" y="531">route / next</text>
  </g>
  <text x="1216" y="578" font-size="11" font-style="italic" fill="#5e8e93">checkpointed (SqliteSaver)</text>
  <text x="1216" y="596" font-size="11" font-style="italic" fill="#5e8e93">thread_id = session_id</text>

  <!-- divider -->
  <line x1="60" y1="660" x2="1140" y2="660" stroke="#3a2f1c" stroke-width="1"/>

  <!-- ============ PHASE 2 : RUNTIME LOOP ============ -->
  <text x="60" y="694" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" fill="#ebc473">② Runtime loop (player)</text>

  <!-- Player / beat view -->
  <rect x="70" y="712" width="230" height="120" rx="14" fill="url(#humanGrad)" stroke="#6ab0de" stroke-width="1.6"/>
  <text x="185" y="740" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" text-anchor="middle" fill="#9fd0ee">Player — beat view</text>
  <line x1="96" y1="751" x2="274" y2="751" stroke="#6ab0de" stroke-opacity="0.3"/>
  <text x="88" y="775" font-size="12.5" fill="#f3e7cf">reads beat statements</text>
  <text x="88" y="797" font-size="12.5" fill="#f3e7cf">served from cache (~5ms)</text>
  <text x="88" y="819" font-size="12.5" fill="#9fd0ee">presents 3 choices + custom box</text>

  <!-- decision diamond -->
  <polygon points="392,772 452,742 512,772 452,802" fill="#15100a" stroke="#d4a857" stroke-width="1.4"/>
  <text x="452" y="777" font-size="12.5" text-anchor="middle" fill="#ebc473">input?</text>
  <line x1="300" y1="772" x2="388" y2="772" stroke="#6ab0de" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- branch: 1 of 3 -> advance/loop -->
  <path d="M452,802 C452,860 300,862 200,838" fill="none" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="878" font-size="11.5" fill="#c4b08a">1 of 3 → apply alignment, advance</text>

  <!-- branch: custom text -> rewrite agent -->
  <line x1="512" y1="772" x2="636" y2="772" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="762" font-size="11.5" fill="#ebc473">custom text →</text>

  <!-- Beat-Rewrite Agent -->
  <rect x="640" y="712" width="270" height="120" rx="14" fill="url(#agentGrad)" stroke="#d4a857" stroke-width="1.6"/>
  <text x="775" y="740" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" text-anchor="middle" fill="#ebc473">Beat-Rewrite Agent</text>
  <line x1="666" y1="751" x2="884" y2="751" stroke="#d4a857" stroke-opacity="0.3"/>
  <text x="658" y="775" font-size="12.5" fill="#f3e7cf">• rewrites beat text to fit input</text>
  <text x="658" y="795" font-size="12.5" fill="#f3e7cf">• keeps overall story intact</text>
  <text x="658" y="815" font-size="12.5" fill="#9fd0ee">• nudges back to 3 choices / endings</text>

  <!-- rewrite -> back to player -->
  <path d="M775,712 C775,672 300,672 200,708" fill="none" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="668" font-size="11.5" fill="#c4b08a">re-render beat → continue (canon unchanged)</text>

  <!-- rewrite consults memory (dashed up) -->
  <path d="M860,712 C880,650 760,628 720,624" fill="none" stroke="#b87d4a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="900" y="690" font-size="11" font-style="italic" fill="#b87d4a">guarded by Memory</text>

  <!-- chapter end -> chapter generator -->
  <path d="M952,760 C1030,760 1010,470 950,446" fill="none" stroke="#ebc473" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="966" y="700" font-size="11.5" fill="#ebc473">chapter end +</text>
  <text x="966" y="716" font-size="11.5" fill="#ebc473">user feedback ↑</text>

  <!-- footer note -->
  <text x="60" y="918" font-size="11.5" font-style="italic" fill="#6b5c3e">Rough draft — agents are LangGraph nodes over one checkpointed StoryState; Memory Agent is the conditional gate on every mutation; current v2 pre-render stays as the asset/audio backend.</text>
</svg>
