<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#14110b"/>
    </linearGradient>
    <linearGradient id="phaseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a857"/>
      <stop offset="100%" stop-color="#c4663a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#07060a"/>
  <ellipse cx="640" cy="-100" rx="900" ry="350" fill="#1c1207" opacity="0.55"/>

  <text x="60" y="62" font-family="Cormorant Garamond, serif" font-size="34" fill="#f3e7cf">Generation pipeline</text>
  <line x1="62" y1="80" x2="220" y2="80" stroke="#d4a857" stroke-width="1.3"/>
  <text x="60" y="105" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" fill="#ebc473">Parallel everywhere. Total ~3.5–5 min, then zero waits during play.</text>

  <!-- timeline rail -->
  <line x1="100" y1="180" x2="100" y2="650" stroke="#d4a857" stroke-opacity="0.25" stroke-width="2"/>

  <!-- phase A -->
  <g transform="translate(80,170)">
    <circle cx="20" cy="20" r="20" fill="url(#phaseGrad)"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1208">A</text>
    <rect x="80" y="0" width="1050" height="60" rx="10" fill="url(#cardGrad2)" stroke="#d4a857" stroke-width="0.8"/>
    <text x="105" y="28" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#ebc473">World + spine + endings</text>
    <text x="105" y="50" font-size="12" fill="#c4b08a">Single Gemini Pro 2.5 call — bakes the cast, 10-beat spine, 3 choices/beat, 5 endings catalogue, opening script</text>
    <text x="1100" y="33" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">45 s</text>
  </g>

  <!-- phase B -->
  <g transform="translate(80,250)">
    <circle cx="20" cy="20" r="20" fill="url(#phaseGrad)"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1208">B</text>
    <rect x="80" y="0" width="1050" height="60" rx="10" fill="url(#cardGrad2)" stroke="#d4a857" stroke-width="0.8"/>
    <text x="105" y="28" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#ebc473">Character neutrals (parallel)</text>
    <text x="105" y="50" font-size="12" fill="#c4b08a">All N neutral sprites in parallel — identity anchor for every subsequent emotion + overlay</text>
    <text x="1100" y="33" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">12 s</text>
  </g>

  <!-- phase C -->
  <g transform="translate(80,330)">
    <circle cx="20" cy="20" r="20" fill="url(#phaseGrad)"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1208">C</text>
    <rect x="80" y="0" width="1050" height="60" rx="10" fill="url(#cardGrad2)" stroke="#d4a857" stroke-width="0.8"/>
    <text x="105" y="28" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#ebc473">9 emotions × N chars + N scenes (one 6-worker pool)</text>
    <text x="105" y="50" font-size="12" fill="#c4b08a">Both queues share the Gemini Image quota so no worker stalls waiting for a different stage</text>
    <text x="1100" y="33" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">~100 s</text>
  </g>

  <!-- phase D -->
  <g transform="translate(80,410)">
    <circle cx="20" cy="20" r="20" fill="url(#phaseGrad)"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1208">D</text>
    <rect x="80" y="0" width="1050" height="60" rx="10" fill="url(#cardGrad2)" stroke="#d4a857" stroke-width="0.8"/>
    <text x="105" y="28" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#ebc473">Overlays  ││  8 beat dialogues (Flash 2.5)</text>
    <text x="105" y="50" font-size="12" fill="#c4b08a">Different APIs run in parallel — text doesn't compete with image quota</text>
    <text x="1100" y="33" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">~50 s</text>
  </g>

  <!-- phase E -->
  <g transform="translate(80,490)">
    <circle cx="20" cy="20" r="20" fill="url(#phaseGrad)"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1208">E</text>
    <rect x="80" y="0" width="1050" height="60" rx="10" fill="url(#cardGrad2)" stroke="#d4a857" stroke-width="0.8"/>
    <text x="105" y="28" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#ebc473">Script binding + voice profiles + 5 endings</text>
    <text x="105" y="50" font-size="12" fill="#c4b08a">build_initial_script appends beat 0 choices to Start; ending pre-render runs in parallel</text>
    <text x="1100" y="33" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">~15 s</text>
  </g>

  <!-- phase F -->
  <g transform="translate(80,570)">
    <circle cx="20" cy="20" r="20" fill="url(#phaseGrad)"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1208">F</text>
    <rect x="80" y="0" width="1050" height="60" rx="10" fill="url(#cardGrad2)" stroke="#c4663a" stroke-width="1.2"/>
    <text x="105" y="28" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#ebc473">TTS pre-render of every line (Silk Mulberry, 8 workers)</text>
    <text x="105" y="50" font-size="12" fill="#c4b08a">Opening + every cached beat + every cached ending — written to disk before status flips to "ready"</text>
    <text x="1100" y="33" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">~90 s</text>
  </g>

  <text x="60" y="700" font-size="12" font-style="italic" fill="#8c7a5b">After phase F the session is "ready" — every page advance from here is a DB lookup, no LLM, no TTS call.</text>
</svg>
