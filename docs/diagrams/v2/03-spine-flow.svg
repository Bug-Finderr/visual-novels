<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cardGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#14110b"/>
    </linearGradient>
    <linearGradient id="beatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a857"/>
      <stop offset="100%" stop-color="#9a743a"/>
    </linearGradient>
    <marker id="arrowFlow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a857"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4663a"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#07060a"/>
  <ellipse cx="640" cy="-100" rx="900" ry="350" fill="#1c1207" opacity="0.55"/>

  <text x="60" y="62" font-family="Cormorant Garamond, serif" font-size="34" fill="#f3e7cf">Story spine</text>
  <line x1="62" y1="80" x2="200" y2="80" stroke="#d4a857" stroke-width="1.3"/>
  <text x="60" y="105" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" fill="#ebc473">Linear content. Branching destination. Choices nudge alignment.</text>

  <!-- spine row -->
  <g>
    <!-- opening -->
    <rect x="60" y="190" width="110" height="80" rx="14" fill="url(#cardGrad3)" stroke="#d4a857" stroke-width="1"/>
    <text x="115" y="222" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="16" font-style="italic" fill="#ebc473">opening</text>
    <text x="115" y="244" text-anchor="middle" font-size="11" fill="#c4b08a">Start label</text>
    <text x="115" y="259" text-anchor="middle" font-size="11" fill="#c4b08a">+ beat 0 choices</text>
  </g>

  <!-- arrow opening → beat 0 -->
  <line x1="170" y1="230" x2="220" y2="230" stroke="#d4a857" stroke-width="1.8" marker-end="url(#arrowFlow)"/>

  <!-- beats 0..9 -->
  <g>
    <!-- beat 0..9 in two rows of 5 -->
    <g transform="translate(220,190)">
      <!-- beat 0 -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">0</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 1 -->
      <g transform="translate(98,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">1</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 2 -->
      <g transform="translate(196,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">2</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 3 -->
      <g transform="translate(294,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">3</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 4 -->
      <g transform="translate(392,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">4</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 5 -->
      <g transform="translate(490,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">5</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 6 -->
      <g transform="translate(588,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">6</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 7 -->
      <g transform="translate(686,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">7</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 8 -->
      <g transform="translate(784,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">8</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">3 choices</text>
      </g>
      <!-- beat 9 -->
      <g transform="translate(882,0)">
        <rect x="0" y="0" width="78" height="80" rx="12" fill="url(#beatGrad)"/>
        <text x="39" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1208">BEAT</text>
        <text x="39" y="48" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-weight="600" fill="#1a1208">9</text>
        <text x="39" y="68" text-anchor="middle" font-size="9" fill="#1a1208">FINAL</text>
      </g>
    </g>

    <!-- arrows between beats -->
    <g stroke="#d4a857" stroke-width="1.4" fill="none" marker-end="url(#arrowFlow)">
      <line x1="300" y1="230" x2="316" y2="230"/>
      <line x1="398" y1="230" x2="414" y2="230"/>
      <line x1="496" y1="230" x2="512" y2="230"/>
      <line x1="594" y1="230" x2="610" y2="230"/>
      <line x1="692" y1="230" x2="708" y2="230"/>
      <line x1="790" y1="230" x2="806" y2="230"/>
      <line x1="888" y1="230" x2="904" y2="230"/>
      <line x1="986" y1="230" x2="1002" y2="230"/>
      <line x1="1084" y1="230" x2="1100" y2="230"/>
    </g>
  </g>

  <!-- alignment_state aggregator -->
  <g>
    <rect x="280" y="340" width="920" height="80" rx="14" fill="url(#cardGrad3)" stroke="#d4a857" stroke-width="0.8"/>
    <text x="740" y="370" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" fill="#ebc473">alignment_state{ending_id → score}</text>
    <text x="740" y="395" text-anchor="middle" font-size="12" fill="#c4b08a">each chosen alignmentTag adds magnitude (1–3) to the matching ending's score</text>
    <!-- vertical lines from each beat into the alignment row -->
    <g stroke="#d4a857" stroke-width="1" stroke-dasharray="2,4" opacity="0.45">
      <line x1="259" y1="270" x2="259" y2="340"/>
      <line x1="357" y1="270" x2="357" y2="340"/>
      <line x1="455" y1="270" x2="455" y2="340"/>
      <line x1="553" y1="270" x2="553" y2="340"/>
      <line x1="651" y1="270" x2="651" y2="340"/>
      <line x1="749" y1="270" x2="749" y2="340"/>
      <line x1="847" y1="270" x2="847" y2="340"/>
      <line x1="945" y1="270" x2="945" y2="340"/>
      <line x1="1043" y1="270" x2="1043" y2="340"/>
      <line x1="1141" y1="270" x2="1141" y2="340"/>
    </g>
  </g>

  <!-- arrow alignment → ending picker -->
  <line x1="740" y1="420" x2="740" y2="470" stroke="#c4663a" stroke-width="1.6" marker-end="url(#arrowEnd)"/>

  <!-- endings -->
  <g>
    <text x="60" y="510" font-family="Cormorant Garamond, serif" font-size="22" font-style="italic" fill="#ebc473">5 cached endings — the one with the highest alignment score fires</text>
    <line x1="60" y1="525" x2="320" y2="525" stroke="#c4663a" stroke-opacity="0.6"/>
  </g>
  <g transform="translate(60,545)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="220" height="105" rx="14" fill="url(#cardGrad3)" stroke="#c4663a" stroke-width="1.1"/>
      <text x="110" y="32" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" fill="#ebc473">Ending A</text>
      <text x="110" y="58" text-anchor="middle" font-size="11" fill="#c4b08a">alignmentTag: noble</text>
      <text x="110" y="80" text-anchor="middle" font-size="11" fill="#c4b08a">finalSceneId: throne_room</text>
    </g>
    <g transform="translate(240,0)">
      <rect x="0" y="0" width="220" height="105" rx="14" fill="url(#cardGrad3)" stroke="#c4663a" stroke-width="1.1"/>
      <text x="110" y="32" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" fill="#ebc473">Ending B</text>
      <text x="110" y="58" text-anchor="middle" font-size="11" fill="#c4b08a">alignmentTag: shadow</text>
      <text x="110" y="80" text-anchor="middle" font-size="11" fill="#c4b08a">finalSceneId: dark_path</text>
    </g>
    <g transform="translate(480,0)">
      <rect x="0" y="0" width="220" height="105" rx="14" fill="url(#cardGrad3)" stroke="#c4663a" stroke-width="1.1"/>
      <text x="110" y="32" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" fill="#ebc473">Ending C</text>
      <text x="110" y="58" text-anchor="middle" font-size="11" fill="#c4b08a">alignmentTag: truth</text>
      <text x="110" y="80" text-anchor="middle" font-size="11" fill="#c4b08a">finalSceneId: archive</text>
    </g>
    <g transform="translate(720,0)">
      <rect x="0" y="0" width="220" height="105" rx="14" fill="url(#cardGrad3)" stroke="#c4663a" stroke-width="1.1"/>
      <text x="110" y="32" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" fill="#ebc473">Ending D</text>
      <text x="110" y="58" text-anchor="middle" font-size="11" fill="#c4b08a">alignmentTag: love</text>
      <text x="110" y="80" text-anchor="middle" font-size="11" fill="#c4b08a">finalSceneId: garden</text>
    </g>
    <g transform="translate(960,0)">
      <rect x="0" y="0" width="220" height="105" rx="14" fill="url(#cardGrad3)" stroke="#c4663a" stroke-width="1.1"/>
      <text x="110" y="32" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-style="italic" fill="#ebc473">Ending E</text>
      <text x="110" y="58" text-anchor="middle" font-size="11" fill="#c4b08a">alignmentTag: escape</text>
      <text x="110" y="80" text-anchor="middle" font-size="11" fill="#c4b08a">finalSceneId: harbor</text>
    </g>
  </g>

  <text x="60" y="700" font-size="12" font-style="italic" fill="#8c7a5b">All beats AND all endings pre-rendered into beat_expansions + ending_dialogue at generation time.</text>
</svg>
