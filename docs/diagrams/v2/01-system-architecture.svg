<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#14110b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#d4a857"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#07060a"/>
  <ellipse cx="640" cy="-100" rx="900" ry="350" fill="#1c1207" opacity="0.55"/>

  <!-- title -->
  <text x="60" y="62" font-family="Cormorant Garamond, serif" font-size="34" fill="#f3e7cf">System architecture</text>
  <line x1="62" y1="80" x2="220" y2="80" stroke="#d4a857" stroke-width="1.3"/>
  <text x="60" y="105" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" fill="#ebc473">v2 — split hosting, WS audio, cached story</text>

  <!-- BROWSER -->
  <g>
    <rect x="60" y="180" width="280" height="380" rx="16" fill="url(#cardGrad)" stroke="#d4a857" stroke-width="1.4"/>
    <text x="200" y="220" font-family="Cormorant Garamond, serif" font-size="22" font-style="italic" text-anchor="middle" fill="#ebc473">Browser</text>
    <line x1="100" y1="234" x2="300" y2="234" stroke="#d4a857" stroke-opacity="0.35"/>

    <text x="80" y="270" font-size="13" fill="#f3e7cf">• SPA (Vite)</text>
    <text x="80" y="295" font-size="13" fill="#f3e7cf">• Game engine (game-bridge.js)</text>
    <text x="80" y="320" font-size="13" fill="#f3e7cf">• AudioContext + AnalyserNode</text>
    <text x="80" y="345" font-size="13" fill="#f3e7cf">• StreamingVoicePlayer</text>
    <text x="80" y="370" font-size="13" fill="#f3e7cf">• Pause menu + saves UI</text>

    <text x="80" y="420" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">HTTPS</text>
    <text x="80" y="442" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">/api/sessions/...</text>

    <text x="80" y="495" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">WSS</text>
    <text x="80" y="517" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">/api/.../tts/stream</text>
  </g>

  <!-- HTTPS arrow -->
  <line x1="340" y1="420" x2="540" y2="320" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- WSS arrow -->
  <line x1="340" y1="510" x2="540" y2="470" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FASTAPI -->
  <g>
    <rect x="540" y="220" width="280" height="280" rx="16" fill="url(#cardGrad)" stroke="#d4a857" stroke-width="1.6"/>
    <text x="680" y="262" font-family="Cormorant Garamond, serif" font-size="22" font-style="italic" text-anchor="middle" fill="#ebc473">FastAPI (uvicorn)</text>
    <line x1="580" y1="276" x2="780" y2="276" stroke="#d4a857" stroke-opacity="0.35"/>

    <text x="560" y="310" font-size="13" fill="#f3e7cf">routes/</text>
    <text x="572" y="332" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">  sessions  generation</text>
    <text x="572" y="352" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">  gameplay  saves</text>
    <text x="572" y="372" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">  tts_stream  assets</text>

    <text x="560" y="408" font-size="13" fill="#f3e7cf">services/</text>
    <text x="572" y="430" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">  dialogue_engine</text>
    <text x="572" y="450" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">  tts_generator + silk_client</text>
    <text x="572" y="470" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">  image_generator</text>
  </g>

  <!-- arrows to externals -->
  <line x1="820" y1="280" x2="975" y2="220" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="350" x2="975" y2="350" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="420" x2="975" y2="475" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="500" x2="680" y2="565" stroke="#d4a857" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GEMINI -->
  <g>
    <rect x="975" y="180" width="240" height="120" rx="14" fill="url(#cardGrad)" stroke="#d4a857" stroke-width="1.2"/>
    <text x="1095" y="216" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#ebc473">Gemini</text>
    <text x="995" y="244" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">Pro 2.5 — world</text>
    <text x="995" y="262" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">Flash 2.5 — dialogues</text>
    <text x="995" y="280" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">Flash-Image — sprites/scenes</text>
  </g>

  <!-- MULBERRY -->
  <g>
    <rect x="975" y="320" width="240" height="90" rx="14" fill="url(#cardGrad)" stroke="#c4663a" stroke-width="1.5"/>
    <text x="1095" y="354" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#ebc473">Silk Mulberry TTS</text>
    <text x="995" y="380" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">in-house WS engine</text>
    <text x="995" y="398" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">PCM int16 LE @ 24 kHz</text>
  </g>

  <!-- DISK -->
  <g>
    <rect x="975" y="430" width="240" height="90" rx="14" fill="url(#cardGrad)" stroke="#91a87a" stroke-width="1.2"/>
    <text x="1095" y="464" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#91a87a">Local FS</text>
    <text x="995" y="490" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">sprites / backgrounds</text>
    <text x="995" y="508" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">overlays / audio (sha1.wav)</text>
  </g>

  <!-- SQLITE -->
  <g>
    <rect x="540" y="565" width="280" height="115" rx="14" fill="url(#cardGrad)" stroke="#91a87a" stroke-width="1.2"/>
    <text x="680" y="600" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#91a87a">SQLite</text>
    <text x="560" y="624" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">sessions  characters  scenes</text>
    <text x="560" y="642" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">beat_expansions  ending_dialogue</text>
    <text x="560" y="660" font-size="12" font-family="JetBrains Mono, monospace" fill="#c4b08a">script_labels  saves  dialogue_history</text>
  </g>

  <!-- footer note -->
  <text x="60" y="690" font-size="12" font-style="italic" fill="#8c7a5b">Browser only ever talks to FastAPI. FastAPI talks to everything else.</text>
</svg>
