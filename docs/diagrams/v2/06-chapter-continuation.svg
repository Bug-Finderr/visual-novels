<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cardGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#14110b"/>
    </linearGradient>
    <linearGradient id="chapterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <marker id="arrowChap" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#d4a857"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#07060a"/>
  <ellipse cx="640" cy="-100" rx="900" ry="350" fill="#1c1207" opacity="0.55"/>

  <text x="60" y="62" font-family="Cormorant Garamond, serif" font-size="34" fill="#f3e7cf">Continue to next chapter</text>
  <line x1="62" y1="80" x2="320" y2="80" stroke="#d4a857" stroke-width="1.3"/>
  <text x="60" y="105" font-family="Cormorant Garamond, serif" font-size="17" font-style="italic" fill="#ebc473">A child session inherits world + cast; gets a new spine + new endings.</text>

  <!-- Chapter 1 card -->
  <g>
    <rect x="60" y="170" width="540" height="430" rx="20" fill="url(#chapterGrad)" stroke="#d4a857" stroke-width="1.4"/>
    <text x="80" y="210" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">CHAPTER 1</text>
    <text x="80" y="245" font-family="Cormorant Garamond, serif" font-size="28" fill="#f3e7cf">A New Arrival</text>
    <line x1="80" y1="258" x2="200" y2="258" stroke="#d4a857" stroke-opacity="0.5"/>

    <text x="80" y="290" font-size="13" fill="#c4b08a">world_lore: Eldoria — a magical kingdom</text>
    <text x="80" y="310" font-size="13" fill="#c4b08a">characters: aria, lord_baltus, sage_ren, ...</text>
    <text x="80" y="330" font-size="13" fill="#c4b08a">spine: 10 beats</text>
    <text x="80" y="350" font-size="13" fill="#c4b08a">endings: 5 candidates</text>

    <text x="80" y="395" font-size="13" font-weight="600" fill="#ebc473">player plays through →</text>
    <text x="80" y="415" font-size="13" font-weight="600" fill="#ebc473">alignment_state accumulates →</text>
    <text x="80" y="435" font-size="13" font-weight="600" fill="#ebc473">final beat fires:</text>

    <rect x="80" y="455" width="440" height="120" rx="14" fill="#18140e" stroke="#c4663a" stroke-width="1.2"/>
    <text x="100" y="485" font-family="JetBrains Mono, monospace" font-size="12" fill="#c4663a">chosen_ending_id:</text>
    <text x="100" y="510" font-family="Cormorant Garamond, serif" font-size="22" font-style="italic" fill="#ebc473">ending_noble_sacrifice</text>
    <text x="100" y="540" font-size="12" fill="#c4b08a">Aria saves the kingdom but is lost.</text>
    <text x="100" y="558" font-size="12" fill="#c4b08a">A statue is built in her honor.</text>
  </g>

  <!-- arrow between chapters -->
  <g transform="translate(625,365)">
    <circle cx="0" cy="0" r="14" fill="#c4663a"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1208">+</text>
  </g>
  <line x1="600" y1="385" x2="660" y2="385" stroke="#d4a857" stroke-width="2" marker-end="url(#arrowChap)"/>
  <text x="635" y="355" text-anchor="middle" font-size="13" font-style="italic" fill="#ebc473">Continue</text>
  <text x="635" y="430" text-anchor="middle" font-size="11" font-family="JetBrains Mono, monospace" fill="#c4b08a">POST /sessions/{id}/continue</text>

  <!-- Chapter 2 card -->
  <g>
    <rect x="680" y="170" width="540" height="430" rx="20" fill="url(#chapterGrad)" stroke="#d4a857" stroke-width="1.4"/>
    <text x="700" y="210" font-family="JetBrains Mono, monospace" font-size="13" fill="#ebc473">CHAPTER 2 (child session)</text>
    <text x="700" y="245" font-family="Cormorant Garamond, serif" font-size="28" fill="#f3e7cf">The Statue's Echo</text>
    <line x1="700" y1="258" x2="850" y2="258" stroke="#d4a857" stroke-opacity="0.5"/>

    <text x="700" y="290" font-size="13" fill="#91a87a">parent_session_id → Chapter 1</text>
    <text x="700" y="310" font-size="13" fill="#91a87a">chapter_number = 2</text>

    <text x="700" y="350" font-size="13" font-weight="600" fill="#ebc473">build_continuation_prompt:</text>
    <text x="700" y="372" font-size="12" fill="#c4b08a">• Re-use SAME world name + rules</text>
    <text x="700" y="392" font-size="12" fill="#c4b08a">• Re-use SAME character ids</text>
    <text x="700" y="412" font-size="12" fill="#c4b08a">• Pick up AFTER Ch1's chosen ending</text>
    <text x="700" y="432" font-size="12" fill="#c4b08a">• Generate FRESH spine + endings</text>

    <text x="700" y="475" font-size="13" fill="#c4b08a">→ runs the same pipeline as Ch1</text>
    <text x="700" y="495" font-size="13" fill="#c4b08a">→ ends in its own ending</text>
    <text x="700" y="515" font-size="13" fill="#c4b08a">→ can spawn Chapter 3...</text>

    <rect x="700" y="535" width="500" height="50" rx="10" fill="#18140e" stroke="#d4a857" stroke-width="0.8"/>
    <text x="715" y="565" font-size="13" font-style="italic" fill="#ebc473">The library shows each chapter with a "Chapter N" badge.</text>
  </g>

  <text x="60" y="660" font-size="13" font-style="italic" fill="#ebc473">Nothing is regenerated unnecessarily. Chapter 1's cached beats + endings stay on disk.</text>
  <text x="60" y="685" font-size="12" font-style="italic" fill="#8c7a5b">Chapter 2 is a brand-new session whose pipeline runs in parallel with the player browsing back to Ch1 if they want.</text>
</svg>
