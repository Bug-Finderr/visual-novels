[project]
name = "storyplex-server"
version = "0.1.0"
description = "AI-powered visual novel backend (FastAPI + Gemini)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "Pillow>=10.0",
    "rembg>=2.0",
    "onnxruntime>=1.18",
    "httpx>=0.27",
    "websockets>=12.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
