# Render Blueprint for the full StoryPlex stack: backend + Postgres + the SPA.
# Apply via Render dashboard: New + -> Blueprint -> select this repo.
# See DEPLOY-RENDER.md for the full walkthrough (secrets, GCS service account,
# GoDaddy DNS for storyplex.app, Google OAuth client update). URLs below are
# the final custom domains (storyplex.app / api.storyplex.app), fully wired
# to each other already — but those domains stay unverified/pending in Render
# until the GoDaddy DNS records in DEPLOY-RENDER.md step 3 exist.
#
# Free Postgres expires 30 days after creation — fine for a same-day demo;
# switch `plan: free` below to `basic-256mb` ($6/mo) before then if this
# needs to stick around.

databases:
  - name: storyplex-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: storyplex-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: standard
    region: oregon
    healthCheckPath: /api/v1/health
    domains:
      - api.storyplex.app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storyplex-db
          property: connectionString
      - key: ASSET_BACKEND
        value: gcs
      - key: GCS_BUCKET
        value: storyplex-assets
      # Render Blueprints can't declare Secret Files in YAML — add this once
      # via the dashboard (Environment -> Secret Files -> path
      # /etc/secrets/gcs-key.json, contents = the storyplex-render-assets
      # service account's JSON key) before this env var resolves to anything
      # useful. See DEPLOY-RENDER.md.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-key.json
      - key: STORYGEN_ENGINE
        value: graph
      # storyplex.app / api.storyplex.app share one registrable domain, so
      # the session cookie can be same-site — Lax + Secure, no reliance on
      # third-party cookies (which Safari blocks and Chrome is phasing out).
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_REDIRECT_URI
        value: https://api.storyplex.app/api/v1/auth/google/callback
      - key: ALLOWED_ORIGINS
        value: https://storyplex.app
      # Secrets — entered once in the Render dashboard during blueprint setup,
      # never committed to the repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: SILK_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # The SPA, as a Render Static Site — free regardless of the web service's
  # plan, CDN + managed TLS included, custom domains free (2 included per
  # workspace). Reuses the exact build this repo already runs for Netlify
  # (root `npm run build` -> client/dist), so no client-side code changes.
  - type: web
    name: storyplex-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: client/dist
    domains:
      - storyplex.app
    envVars:
      - key: VITE_API_BASE
        value: https://api.storyplex.app/api/v1
      - key: VITE_ASSET_BASE
        value: https://storage.googleapis.com/storyplex-assets
    routes:
      # SPA fallback for react-router — same rule as netlify.toml's redirect.
      - type: rewrite
        source: /**
        destination: /index.html
